# The BeaconKit™ catalog (docs/beaconkit.md › Hosting): manual only (Actions › BeaconKit™ › Run workflow, or
# `gh workflow run kit.yml`); pushes and pull requests never trigger it, so nobody else's code ever reaches the
# self-hosted runner. The Mac mini at home (`brain` on Tailscale, a runner of its own for this repo labelled
# `beacon-kit`, beside Ata-Online's `ata-kit`) collects the Swift sources, builds the site and publishes it to the
# tailnet only, at https://brain.<tailnet>.ts.net:8445. Setup on the mini: docs/beaconkit-mac-mini.md.
name: BeaconKit™
run-name: BeaconKit™ · ${{ inputs.scope }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Kapsam · site: kaynak koddan katalog, görüntüler olduğu gibi"
        type: choice
        options: [site]
        default: site

permissions:
  contents: read
  # The collector lists the open `kit-revize` notes to show them on their items.
  issues: read

# A newer run supersedes one still going.
concurrency:
  group: beacon-kit
  cancel-in-progress: true

jobs:
  catalog:
    # The repo is public and the runner is the owner's own Mac: only the owner starts or re-runs it.
    if: github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, macOS, beacon-kit]
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Every file's last change (the site's "Son değişiklik") needs the history.
          fetch-depth: 0

      - name: Settings
        run: |
          echo "OUT=$HOME/BeaconKit/kit" >> "$GITHUB_ENV"
          # The runner's launchd service starts with a short PATH: Homebrew's gh.
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25

      - name: Site
        working-directory: web
        run: |
          npm ci
          if [[ -f $OUT/export/registry.json ]]; then
            npm run collect -- --kit "$OUT"
          else
            npm run collect
          fi
          npm run build

      # Caddy serves ~/BeaconKit/site/current on 127.0.0.1:8789; Tailscale Serve brings it to the tailnet only (:8445).
      # Each run is a release of its own; the link moves to it in one rename once it is complete, so a reader never
      # sees half a copy. The newest two releases stay.
      - name: Publish
        run: |
          site=$HOME/BeaconKit/site
          mkdir -p "$site/releases"
          rsync -a --delete web/dist/ "$site/releases/$GITHUB_RUN_NUMBER/"
          ln -sfn "releases/$GITHUB_RUN_NUMBER" "$site/current.next"
          mv -fh "$site/current.next" "$site/current"
          for old in $(ls -1t "$site/releases" | tail -n +3); do rm -rf "$site/releases/$old"; done
          echo "Yayında: ~/BeaconKit/site/releases/$GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
