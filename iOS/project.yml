# Beacon, the iPhone app that shows a Mac's readings, and Beacon for Apple Watch inside it (iOS/README.md). XcodeGen writes Beacon.xcodeproj from this file
# (`xcodegen generate`); the project itself is never committed (the repo's .gitignore). The signing team stays out of
# the repo too: Config/Beacon.xcconfig includes the git-ignored Config/Local.xcconfig, which names it.
name: Beacon
options:
  bundleIdPrefix: co.ikili
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Beacon.xcconfig
  Release: Config/Beacon.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Beacon:
    type: application
    platform: iOS
    sources:
      - path: Beacon
      # The protocol the Mac app speaks, the very same file (docs/remote-monitor.md).
      - path: ../Sources/Vorssaint/Services/RemoteMonitor/RemoteMonitorProtocol.swift
        group: Beacon/Shared
    info:
      path: Beacon/Info.plist
      properties:
        CFBundleDisplayName: Beacon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleLocalizations: [en, tr]
        NSLocalNetworkUsageDescription: "Beacon connects to the Macs you pair, on your network or over Tailscale, to show their readings."
        NSBonjourServices: [_beacon-mac._tcp]
        NSCameraUsageDescription: "Beacon uses the camera only to scan the pairing code your Mac shows."
        CFBundleURLTypes:
          - CFBundleURLName: co.ikili.beacon.pair
            CFBundleURLSchemes: [beacon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.ikili.beacon
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    dependencies:
      # Embedded in Beacon.app/Watch: the watch app installs with the phone's.
      - target: BeaconWatch
  # Beacon for Apple Watch. The watch can't reach a Mac itself (watchOS keeps the Network framework to audio and call
  # apps), so it reads them through the phone (Beacon/Connection/WatchLink.swift); it compiles the phone's readings,
  # formats and components, and its own colours (watchOS is always dark).
  BeaconWatch:
    type: application
    platform: watchOS
    sources:
      - path: BeaconWatch
      - path: ../Sources/Vorssaint/Services/RemoteMonitor/RemoteMonitorProtocol.swift
        group: Beacon/Shared
      - Beacon/Connection/WatchLink.swift
      - Beacon/Stores/Readings.swift
      - Beacon/Formatting/Format.swift
      - Beacon/Fixtures/DemoData.swift
      - Beacon/DesignSystem/BeaconStyle.swift
      - Beacon/DesignSystem/Catalog/KitSpecimen.swift
      - Beacon/DesignSystem/Components
      - Beacon/Features/Detail/MetricRows.swift
      - Beacon/Resources/Localizable.xcstrings
      - Beacon/Resources/Assets.xcassets
    info:
      path: BeaconWatch/Info.plist
      properties:
        CFBundleDisplayName: Beacon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations: [en, tr]
        WKApplication: true
        WKCompanionAppBundleIdentifier: co.ikili.beacon
    entitlements:
      path: BeaconWatch/BeaconWatch.entitlements
      properties:
        # Shared with the complication, which draws the last reading the app kept (BeaconWatch/Shared/LastReading.swift).
        com.apple.security.application-groups: [group.co.ikili.beacon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.ikili.beacon.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: BeaconWatchWidgets
  # The complications: a Mac's reading on the watch face, as the watch app last had it.
  BeaconWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: BeaconWatchWidgets
      - path: ../Sources/Vorssaint/Services/RemoteMonitor/RemoteMonitorProtocol.swift
        group: Beacon/Shared
      - BeaconWatch/Shared/LastReading.swift
      - BeaconWatch/DesignSystem/BeaconColor+watchOS.swift
      - Beacon/Stores/Readings.swift
      - Beacon/Formatting/Format.swift
      - Beacon/Fixtures/DemoData.swift
      - Beacon/Resources/Localizable.xcstrings
    info:
      path: BeaconWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Beacon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations: [en, tr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BeaconWatchWidgets/BeaconWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.co.ikili.beacon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.ikili.beacon.watchkitapp.widgets
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  BeaconTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BeaconTests]
    dependencies:
      - target: Beacon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.ikili.beacon.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Beacon:
    build:
      targets:
        Beacon: all
        BeaconTests: [test]
    test:
      targets: [BeaconTests]
    run:
      commandLineArguments:
        "-demo 1": false
  BeaconWatch:
    build:
      targets:
        BeaconWatch: all
    run:
      commandLineArguments:
        "-demo 1": false
